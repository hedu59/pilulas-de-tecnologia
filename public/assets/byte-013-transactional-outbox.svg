<title id="title">Pílula 013 — Transactional Outbox Pattern</title>
<desc id="desc">Byte, macaquinho desenvolvedor de moletom turquesa, apresenta o fluxo API .NET, SQL Server com Apólice e Outbox na mesma transação, Outbox Worker, RabbitMQ e consumidor idempotente.</desc>
